name: Deploy HadirUpah to GitHub Pages

on:
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static Pages site
        run: pnpm exec vite build --config vite.pages.config.ts
      - name: Verify built Pages files
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::Static Vite build is missing dist/index.html"
            find dist -maxdepth 4 -type f | sort | head -100
            exit 1
          fi
          if [ ! -f dist/manifest.webmanifest ]; then
            echo "::error::Static Vite build is missing manifest.webmanifest"
            find dist -maxdepth 3 -type f | sort | head -100
            exit 1
          fi
          if grep -q 'src="/src/main.tsx"' dist/index.html; then
            echo "::error::Published index is the unbuilt source HTML"
            grep -E 'manifest|script' dist/index.html
            exit 1
          fi
          echo "Verified built index and manifest in dist"
          grep -E 'manifest|script' dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
